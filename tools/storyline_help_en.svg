<svg width="2988" height="4640" viewBox="0 0 2988 4640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0807"/>
      <stop offset="30%" stop-color="#0e0c09"/>
      <stop offset="70%" stop-color="#100d0a"/>
      <stop offset="100%" stop-color="#0a0807"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a6e30"/>
      <stop offset="50%" stop-color="#e8c77b"/>
      <stop offset="100%" stop-color="#8a6e30"/>
    </linearGradient>

    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#606870"/>
      <stop offset="50%" stop-color="#ccd4dc"/>
      <stop offset="100%" stop-color="#606870"/>
    </linearGradient>

    <linearGradient id="bronzeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6e4620"/>
      <stop offset="50%" stop-color="#c98a4b"/>
      <stop offset="100%" stop-color="#6e4620"/>
    </linearGradient>

    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4422"/>
      <stop offset="60%" stop-color="#dd2200"/>
      <stop offset="100%" stop-color="#770000"/>
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14110d" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0d0a08" stop-opacity="0.95"/>
    </linearGradient>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="2988" height="4640" fill="url(#bgGrad)"/>
  
  <!-- Subtle Border / Frame -->
  <rect x="60" y="60" width="2868" height="4520" rx="16" fill="none" stroke="#2a2216" stroke-width="4"/>
  <rect x="80" y="80" width="2828" height="4480" rx="12" fill="none" stroke="#1c160e" stroke-width="2"/>

  <!-- ========================================== -->
  <!-- SECTION 1: HEADER & INTRODUCTION          -->
  <!-- ========================================== -->
  <g transform="translate(180, 160)">
    <!-- Decorative Header Line -->
    <path d="M 0,0 L 400,0 M 2228,0 L 2628,0" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="420" cy="0" r="6" fill="#e8c77b"/>
    <circle cx="2208" cy="0" r="6" fill="#e8c77b"/>
    
    <text x="1314" y="10" text-anchor="middle" font-family="'Cinzel', 'Trajan Pro', 'Georgia', serif" font-size="64" font-weight="700" fill="url(#goldGrad)" letter-spacing="8">NAVIGATING THE REALM</text>

    <!-- Introductory Paragraphs -->
    <g transform="translate(0, 100)" font-family="'Segoe UI', -apple-system, sans-serif" font-size="44" fill="#d8cec0" line-height="1.6">
      <text x="1314" y="0" text-anchor="middle">Throughout your journey in <tspan fill="#e8c77b" font-weight="600">Mandate of Heaven</tspan>, every choice you make can steer the realm toward a vastly different fate.</text>
      <text x="1314" y="75" text-anchor="middle">To enhance your experience, you may jump directly to any previously reached node on the flowchart</text>
      <text x="1314" y="150" text-anchor="middle">to explore new storylines without having to replay familiar scenes.</text>
      
      <text x="1314" y="270" text-anchor="middle" fill="#c0b098">If you meet an untimely demise or an unfavorable ending, do not be discouraged:</text>
      <text x="1314" y="345" text-anchor="middle" fill="#e8c77b">Return to earlier turning points and make new decisions to rewrite destiny.</text>
    </g>

    <line x1="300" y1="560" x2="2328" y2="560" stroke="#33281a" stroke-width="2"/>
  </g>

  <!-- ========================================== -->
  <!-- SECTION 2: HOW TO CHANGE ENDINGS          -->
  <!-- ========================================== -->
  <g transform="translate(180, 800)">
    <text x="60" y="0" font-family="'Cinzel', 'Georgia', serif" font-size="56" font-weight="700" fill="url(#goldGrad)" letter-spacing="4">HOW TO ALTER GAME ENDINGS</text>

    <!-- ================= Card 1: Review Decisions ================= -->
    <g transform="translate(0, 70)" filter="url(#shadow)">
      <rect x="0" y="0" width="2628" height="660" rx="16" fill="url(#cardBg)" stroke="#382b1c" stroke-width="3"/>
      
      <!-- Visual Flowchart Diagram Left -->
      <g transform="translate(60, 50)">
        <rect x="0" y="0" width="1280" height="560" rx="12" fill="#090806" stroke="#221b12" stroke-width="2"/>
        
        <!-- Connecting Branch Path Line -->
        <path d="M 60,380 C 220,380 260,180 440,180 L 880,180 C 1040,180 1100,320 1200,320" fill="none" stroke="#8c7042" stroke-width="8" stroke-dasharray="14 8"/>
        <path d="M 440,180 C 580,180 620,440 780,440 L 1200,440" fill="none" stroke="#50422e" stroke-width="6"/>

        <!-- Scene Thumbnail Mockup Left -->
        <rect x="80" y="300" width="160" height="110" rx="8" fill="#1e1812" stroke="#8a6e30" stroke-width="3"/>
        <text x="160" y="365" font-family="'Segoe UI', sans-serif" font-size="24" fill="#a0907a" text-anchor="middle">Scene Node</text>

        <!-- Decision Point Node -->
        <circle cx="440" cy="180" r="44" fill="#1a140d" stroke="#e8c77b" stroke-width="4"/>
        <text x="440" y="188" font-family="'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#e8c77b" text-anchor="middle">Choice</text>
        <rect x="360" y="90" width="160" height="45" rx="6" fill="#2a1f12" stroke="#c5a059" stroke-width="2"/>
        <text x="440" y="122" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="600" fill="#e8c77b" text-anchor="middle">Choice 1</text>

        <!-- Attribute Indicator Cloud Icon Node -->
        <g transform="translate(680, 150)">
          <circle cx="30" cy="30" r="34" fill="#241b10" stroke="#708c90" stroke-width="3"/>
          <!-- Mini Cloud Shape -->
          <path d="M 16,34 Q 14,24 24,24 Q 28,14 40,18 Q 48,16 48,28 Q 54,34 40,36 Z" fill="#88b0b8"/>
        </g>
        <text x="710" y="245" font-family="'Segoe UI', sans-serif" font-size="22" fill="#90a8b0" text-anchor="middle">Affects Stats</text>

        <!-- Scene Thumbnail Mockup Right -->
        <rect x="980" y="260" width="180" height="120" rx="8" fill="#1e1812" stroke="#e8c77b" stroke-width="4"/>
        <text x="1070" y="328" font-family="'Segoe UI', sans-serif" font-size="24" fill="#e8c77b" text-anchor="middle">New Branch</text>
      </g>

      <!-- Text Description Right -->
      <g transform="translate(1400, 120)">
        <circle cx="20" cy="20" r="10" fill="#e8c77b"/>
        <text x="50" y="32" font-family="'Cinzel', 'Georgia', serif" font-size="50" font-weight="700" fill="#e8c77b">Revisit Pivotal Decisions</text>
        
        <g transform="translate(50, 100)" font-family="'Segoe UI', sans-serif" font-size="34" fill="#d0c4b4" line-height="1.5">
          <text x="0" y="0">Critical choice nodes govern the trajectory of the whole story.</text>
          <text x="0" y="55">If you reach a disastrous outcome or bad ending:</text>
          <text x="0" y="130" fill="#e8c77b" font-weight="600">1. Click any earlier choice node directly on the map.</text>
          <text x="0" y="185" fill="#e8c77b" font-weight="600">2. Select an alternative path to explore new consequences.</text>
          <text x="0" y="260" fill="#9e9080">You do not need to rewatch preceding scenes from the start.</text>
        </g>
      </g>
    </g>

    <!-- ================= Card 2: Hidden Storylines ================= -->
    <g transform="translate(0, 780)" filter="url(#shadow)">
      <rect x="0" y="0" width="2628" height="660" rx="16" fill="url(#cardBg)" stroke="#382b1c" stroke-width="3"/>
      
      <!-- Visual Flowchart Diagram Left -->
      <g transform="translate(60, 50)">
        <rect x="0" y="0" width="1280" height="560" rx="12" fill="#090806" stroke="#221b12" stroke-width="2"/>
        
        <path d="M 60,300 C 220,300 280,180 440,180 L 1200,180" fill="none" stroke="#50422e" stroke-width="6"/>
        <path d="M 440,180 C 580,180 620,420 780,420 L 1200,420" fill="none" stroke="#c5a059" stroke-width="8" stroke-dasharray="12 6"/>

        <circle cx="440" cy="180" r="36" fill="#1a140d" stroke="#8a6e30" stroke-width="3"/>
        <text x="440" y="125" font-family="'Segoe UI', sans-serif" font-size="22" fill="#8a6e30" text-anchor="middle">Choice 1</text>

        <!-- Choice 2 to Hidden Arc -->
        <circle cx="780" cy="420" r="44" fill="#241a0e" stroke="#e8c77b" stroke-width="4" filter="url(#goldGlow)"/>
        <rect x="700" y="485" width="160" height="45" rx="6" fill="#2a1f12" stroke="#e8c77b" stroke-width="2"/>
        <text x="780" y="516" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#e8c77b" text-anchor="middle">Choice 2</text>

        <!-- Hidden Arc Destination -->
        <rect x="960" y="360" width="220" height="120" rx="8" fill="#1e1812" stroke="#e8c77b" stroke-width="4"/>
        <text x="1070" y="415" font-family="'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#e8c77b" text-anchor="middle">Secret Branch</text>
        <text x="1070" y="450" font-family="'Segoe UI', sans-serif" font-size="20" fill="#a0907a" text-anchor="middle">Exclusive Storyline</text>
      </g>

      <!-- Text Description Right -->
      <g transform="translate(1400, 120)">
        <circle cx="20" cy="20" r="10" fill="#e8c77b"/>
        <text x="50" y="32" font-family="'Cinzel', 'Georgia', serif" font-size="50" font-weight="700" fill="#e8c77b">Discover Hidden Storylines</text>
        
        <g transform="translate(50, 100)" font-family="'Segoe UI', sans-serif" font-size="34" fill="#d0c4b4" line-height="1.5">
          <text x="0" y="0">Uncommon or subtle dialogue choices frequently branch into</text>
          <text x="0" y="55">exclusive storylines, covert alliances, and character backstories.</text>
          <text x="0" y="140" fill="#e8c77b">Continued exploration unveils deeper political intrigue</text>
          <text x="0" y="195" fill="#e8c77b">and grants access to the realm's highest-tier endings.</text>
          <text x="0" y="270" fill="#9e9080">Keep an eye out for branching paths diverging from main lines.</text>
        </g>
      </g>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- SECTION 3: KEY ATTRIBUTES & THRESHOLDS    -->
  <!-- ========================================== -->
  <g transform="translate(180, 2350)">
    <text x="60" y="0" font-family="'Cinzel', 'Georgia', serif" font-size="56" font-weight="700" fill="url(#goldGrad)" letter-spacing="4">KEY CHARACTER ATTRIBUTES</text>

    <g transform="translate(0, 70)" filter="url(#shadow)">
      <rect x="0" y="0" width="2628" height="660" rx="16" fill="url(#cardBg)" stroke="#382b1c" stroke-width="3"/>

      <!-- Attributes Explanation Left -->
      <g transform="translate(80, 90)">
        <circle cx="20" cy="20" r="10" fill="#e8c77b"/>
        <text x="50" y="32" font-family="'Cinzel', 'Georgia', serif" font-size="48" font-weight="700" fill="#e8c77b">Values Dictate Available Paths</text>

        <g transform="translate(50, 90)" font-family="'Segoe UI', sans-serif" font-size="34" fill="#d0c4b4" line-height="1.6">
          <text x="0" y="0">Crucial character attributes are tracked in the top-right corner of the screen.</text>
          <text x="0" y="60">Pay close attention to dialogue clues, allegiances, and moral dilemmas:</text>
          <text x="0" y="140" fill="#e8c77b" font-weight="600">• Reaching specific score thresholds unlocks sealed story paths.</text>
          <text x="0" y="200" fill="#e8c77b" font-weight="600">• Falling below required thresholds may trigger fatal confrontations.</text>
          <text x="0" y="280" fill="#88b0b8" font-style="italic">*Nodes marked with an Auspicious Cloud (祥云) directly alter attributes.</text>
        </g>
      </g>

      <!-- In-Game Tracker Box Mockup Right -->
      <g transform="translate(1780, 110)">
        <rect x="0" y="0" width="760" height="440" rx="12" fill="#120e0a" stroke="#8a6e30" stroke-width="3"/>
        <rect x="15" y="15" width="730" height="410" rx="8" fill="none" stroke="#332514" stroke-width="2"/>
        
        <text x="380" y="70" font-family="'Cinzel', serif" font-size="28" font-weight="700" fill="#a0907a" text-anchor="middle" letter-spacing="2">CURRENT CHAPTER TARGETS</text>
        <line x1="80" y1="100" x2="680" y2="100" stroke="#382b1c" stroke-width="2"/>

        <g transform="translate(60, 160)" font-family="'Segoe UI', sans-serif">
          <!-- Emperor's Trust -->
          <circle cx="20" cy="20" r="8" fill="#e8c77b"/>
          <text x="50" y="28" font-size="30" font-weight="600" fill="#e8c77b">Emperor's Trust</text>
          <text x="640" y="28" font-size="30" font-weight="700" fill="#e8c77b" text-anchor="end">+2 / 5</text>

          <!-- Sikong Zheng's Guilt -->
          <g transform="translate(0, 80)">
            <circle cx="20" cy="20" r="8" fill="#88b0b8"/>
            <text x="50" y="28" font-size="30" font-weight="600" fill="#d0c4b4">Sikong Zheng's Guilt</text>
            <text x="640" y="28" font-size="30" font-weight="700" fill="#88b0b8" text-anchor="end">+1 / 4</text>
          </g>

          <!-- Military Morale -->
          <g transform="translate(0, 160)">
            <circle cx="20" cy="20" r="8" fill="#c06040"/>
            <text x="50" y="28" font-size="30" font-weight="600" fill="#d0c4b4">Military Morale</text>
            <text x="640" y="28" font-size="30" font-weight="700" fill="#c06040" text-anchor="end">Steady</text>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- SECTION 4: STORYLINE ICONS & LEGEND       -->
  <!-- ========================================== -->
  <g transform="translate(180, 3160)">
    <text x="60" y="0" font-family="'Cinzel', 'Georgia', serif" font-size="56" font-weight="700" fill="url(#goldGrad)" letter-spacing="4">STORYLINE LEGEND &amp; ICONS</text>

    <g transform="translate(0, 70)" filter="url(#shadow)">
      <rect x="0" y="0" width="2628" height="1220" rx="16" fill="url(#cardBg)" stroke="#382b1c" stroke-width="3"/>

      <!-- Item 1: Auspicious Cloud (Attribute Node) -->
      <g transform="translate(100, 70)">
        <circle cx="70" cy="70" r="60" fill="#151d20" stroke="#88b0b8" stroke-width="3"/>
        <!-- Cloud Motif -->
        <path d="M 40,75 Q 36,55 56,55 Q 64,36 85,42 Q 100,38 102,60 Q 112,70 88,78 Z" fill="#88b0b8" filter="url(#shadow)"/>
        
        <text x="180" y="60" font-family="'Cinzel', serif" font-size="44" font-weight="700" fill="#88b0b8">Auspicious Cloud (祥云)</text>
        <text x="180" y="105" font-family="'Segoe UI', sans-serif" font-size="32" fill="#d0c4b4">Attribute-Altering Node — Choices or dialogues here directly raise or lower character stats.</text>
      </g>
      <line x1="80" y1="210" x2="2548" y2="210" stroke="#221b12" stroke-width="2"/>

      <!-- Item 2: Failure Ending (Flame) -->
      <g transform="translate(100, 250)">
        <circle cx="70" cy="70" r="60" fill="#200d08" stroke="#ff4422" stroke-width="3"/>
        <!-- Flame Motif -->
        <path d="M 70,30 Q 85,55 75,75 Q 95,65 90,95 Q 85,115 70,115 Q 50,115 50,90 Q 50,65 70,30 Z" fill="url(#flameGrad)" filter="url(#shadow)"/>

        <text x="180" y="60" font-family="'Cinzel', serif" font-size="44" font-weight="700" fill="#ff5533">Flame Marker (失败结局)</text>
        <text x="180" y="105" font-family="'Segoe UI', sans-serif" font-size="32" fill="#d0c4b4">Failure / Bad Ending — Untimely death, execution, or exile. Return to previous nodes to escape.</text>
      </g>
      <line x1="80" y1="390" x2="2548" y2="390" stroke="#221b12" stroke-width="2"/>

      <!-- Item 3: Clear Ending (Bronze Coin) -->
      <g transform="translate(100, 430)">
        <circle cx="70" cy="70" r="60" fill="#1c1208" stroke="url(#bronzeGrad)" stroke-width="4"/>
        <circle cx="70" cy="70" r="42" fill="none" stroke="#8a5e30" stroke-width="3"/>
        <rect x="58" y="58" width="24" height="24" fill="#0c0906" stroke="#8a5e30" stroke-width="2"/>

        <text x="180" y="60" font-family="'Cinzel', serif" font-size="44" font-weight="700" fill="#d99a5b">Bronze Medallion (通关结局)</text>
        <text x="180" y="105" font-family="'Segoe UI', sans-serif" font-size="32" fill="#d0c4b4">Standard Chapter Clear — Successfully resolves the chapter and unlocks the subsequent chapter.</text>
      </g>
      <line x1="80" y1="570" x2="2548" y2="570" stroke="#221b12" stroke-width="2"/>

      <!-- Item 4: Silver Ending -->
      <g transform="translate(100, 610)">
        <circle cx="70" cy="70" r="60" fill="#12161a" stroke="url(#silverGrad)" stroke-width="4"/>
        <circle cx="70" cy="70" r="46" fill="none" stroke="#7e8a94" stroke-width="2"/>
        <path d="M 50,70 L 70,50 L 90,70 L 70,90 Z" fill="#b0c0cc"/>

        <text x="180" y="60" font-family="'Cinzel', serif" font-size="44" font-weight="700" fill="#ccd8e4">Silver Medallion (银色结局)</text>
        <text x="180" y="105" font-family="'Segoe UI', sans-serif" font-size="32" fill="#d0c4b4">Silver Ending — Favorable alternative resolution with high survival and honorable outcomes.</text>
      </g>
      <line x1="80" y1="750" x2="2548" y2="750" stroke="#221b12" stroke-width="2"/>

      <!-- Item 5: Golden Ending (Dragon) -->
      <g transform="translate(100, 790)">
        <circle cx="70" cy="70" r="60" fill="#241a08" stroke="url(#goldGrad)" stroke-width="5" filter="url(#goldGlow)"/>
        <circle cx="70" cy="70" r="48" fill="none" stroke="#e8c77b" stroke-width="2"/>
        <!-- Star / Dragon Emblem -->
        <polygon points="70,38 78,58 98,62 82,78 88,98 70,86 52,98 58,78 42,62 62,58" fill="#e8c77b"/>

        <text x="180" y="60" font-family="'Cinzel', serif" font-size="44" font-weight="700" fill="#e8c77b">Golden Dragon Medallion (金色结局)</text>
        <text x="180" y="105" font-family="'Segoe UI', sans-serif" font-size="32" fill="#d0c4b4">Golden Ending — True / Ultimate Master Ending. Unlocks full historical secrets and maximum glory.</text>
      </g>
      <line x1="80" y1="930" x2="2548" y2="930" stroke="#221b12" stroke-width="2"/>

      <!-- Item 6: Connecting Waypoint Dot -->
      <g transform="translate(100, 970)">
        <circle cx="70" cy="70" r="30" fill="#1a140d" stroke="#e8c77b" stroke-width="4"/>
        <circle cx="70" cy="70" r="14" fill="#e8c77b"/>

        <text x="180" y="60" font-family="'Cinzel', serif" font-size="44" font-weight="700" fill="#d8cec0">Connecting Waypoint Node</text>
        <text x="180" y="105" font-family="'Segoe UI', sans-serif" font-size="32" fill="#d0c4b4">Intermediate checkpoint connecting narrative branches. Click any reached node to jump directly.</text>
      </g>
    </g>
  </g>

  <!-- Bottom Decorative Footer -->
  <g transform="translate(1494, 4530)">
    <text x="0" y="0" text-anchor="middle" font-family="'Cinzel', serif" font-size="28" fill="#50422e" letter-spacing="4">MANDATE OF HEAVEN • STORYLINE GUIDE</text>
  </g>
</svg>